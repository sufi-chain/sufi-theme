name: Release NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_SOURCE_URL: https://nuget.sabp.ir/v3/index.json
  PACKAGE_OUTPUT: ./artifacts/nuget
  ROOT_SLNX: SufiChain.KomTheme.slnx
  RELEASE_TAG: ${{ gitea.event.release.tag_name }}
  REF_NAME: ${{ gitea.ref_name }}
  REPOSITORY: ${{ gitea.repository }}

jobs:
  pack-and-push:
    runs-on: ubuntu-latest
    container:
      image: mcr-mirror.liara.ir/dotnet/sdk:10.0.202

    steps:
      - name: Checkout
        shell: bash
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GITEATOKEN:-}" ]; then
            git clone --depth 1 https://oauth2:${GITEATOKEN}@git.sabp.ir/sufi-chain/kom-theme.git .
          else
            git clone --depth 1 https://git.sabp.ir/sufi-chain/kom-theme.git .
          fi
          ls -la

      - name: Set package version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG:-}" ]; then
            version="$RELEASE_TAG"
          else
            version="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
          fi
          version="${version#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore root solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore "$ROOT_SLNX" --verbosity normal

      - name: Build root solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$ROOT_SLNX" --configuration Release --no-restore --verbosity normal -p:GeneratePackageOnBuild=false

      - name: Discover packable projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          find src \
            \( -path '*/bin' -o -path '*/obj' -o -path '*/.vs' \) -prune -o \
            -type f -name '*.csproj' -print | sort | while read -r project; do
              if grep -Eq '<IsPackable>[[:space:]]*false[[:space:]]*</IsPackable>' "$project"; then
                continue
              fi
              echo "$project"
            done > .ci/package-projects.txt

          if [ ! -s .ci/package-projects.txt ]; then
            echo "No packable projects were discovered."
            exit 1
          fi

          cat .ci/package-projects.txt

      - name: Pack projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_OUTPUT"
          while read -r project; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --output "$PACKAGE_OUTPUT" \
              -p:PackageVersion="$VERSION" \
              -p:ContinuousIntegrationBuild=true \
              -p:GeneratePackageOnBuild=false
          done < .ci/package-projects.txt

      - name: Push packages to BaGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY secret is required."
            exit 1
          fi

          shopt -s nullglob
          packages=("$PACKAGE_OUTPUT"/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages were produced."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "$NUGET_SOURCE_URL" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
